name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux GOARCH=arm64 go vet ./...

  packages:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build unsigned package
        run: scripts/package.sh ${{ matrix.arch }} 0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: dist/*.apk

  install-test:
    needs: packages
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            alpine: "3.21"
          - arch: amd64
            runner: ubuntu-24.04
            alpine: "3.24"
          - arch: arm64
            runner: ubuntu-24.04-arm
            alpine: "3.21"
          - arch: arm64
            runner: ubuntu-24.04-arm
            alpine: "3.24"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: dist
      - name: Install the unsigned package on Alpine ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" alpine:${{ matrix.alpine }} sh -ec '
            sed -i "s|^#\(.*community\)|\1|" /etc/apk/repositories
            apk add --no-cache --allow-untrusted /dist/jukem-*.apk
            jukem version
            id jukem
            test -x /etc/init.d/jukem
          '
