name: Release package

# A new release gets an unsigned apk for each architecture, and a Docker
# image for both. apk installs an unsigned package with --allow-untrusted,
# which the readme shows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, for example v0.1.8
        required: true

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  package:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the unsigned package
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: scripts/package.sh ${{ matrix.arch }} "$TAG"
      - name: Install it on Alpine
        # Go builds both architectures on this runner, but only the native
        # one can run here.
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" alpine:3.21 sh -ec '
            sed -i "s|^#\(.*community\)|\1|" /etc/apk/repositories
            apk add --no-cache --allow-untrusted /dist/jukem-*.apk
            jukem version
          '
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: dist/*.apk

  attach:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true
      - name: List the files with their checksums
        run: cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            dist/*.apk
            dist/SHA256SUMS

  image:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      # An arm64 image is built on this amd64 runner through emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # The token of the run is enough to write a package of this
      # repository, so the workflow needs no key of its own.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: img
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Only a final release moves the latest tag.
          case "$TAG" in
            *-*) echo "latest=" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.img.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.latest }}
