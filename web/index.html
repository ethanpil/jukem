<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>jukem</title>
<link rel="icon" type="image/svg+xml" href="/app/logo.svg">
<link rel="preload" href="/vendor/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="app-header hidden" id="topnav">
  <div class="app-header-inner">
    <a class="brand" href="#/"><span class="logo" data-logo></span>jukem</a>
    <nav class="nav-links" id="topnav-links" aria-label="Sections"></nav>
    <div class="header-tools">
      <a class="bell hidden" id="alert-badge" href="#/health" title="Active alerts"><i class="bi bi-bell" aria-hidden="true"></i><span class="count-dot"></span></a>
      <button type="button" class="owner-chip" id="owner-badge-top" title="Open the health page"></button>
    </div>
  </div>
</header>
<header class="mobile-header hidden" id="mobilenav">
  <a class="brand" href="#/"><span class="logo" data-logo></span>jukem</a>
  <div class="header-tools">
    <a class="bell hidden" id="alert-badge-mobile" href="#/health" title="Active alerts"><i class="bi bi-bell" aria-hidden="true"></i><span class="count-dot"></span></a>
    <button type="button" class="owner-chip compact" id="owner-badge-bar" title="Open the health page"></button>
  </div>
</header>
<div id="alert-banner" class="alert-banner hidden" role="alert"></div>
<main id="main" class="app-main"></main>
<div id="now-bar" class="now-bar hidden">
  <div class="now-bar-inner">
    <button type="button" class="now-bar-play" id="now-bar-play" aria-label="Play or pause"><i class="bi bi-play-fill"></i></button>
    <div class="now-bar-text" id="now-bar-text">
      <div class="now-bar-title" id="now-bar-title"></div>
      <div class="now-bar-sub" id="now-bar-sub"></div>
    </div>
  </div>
</div>
<nav class="tab-bar hidden" id="tab-bar" aria-label="Sections"></nav>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toasts"></div>
<div id="modal-root"></div>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/vendor/sortablejs/Sortable.min.js"></script>
<script type="module" src="/app/main.js"></script>
</body>
</html>
